name: Droop examples
on:
  pull_request:
    paths:
      - 'examples/droop/**'
      - '.github/workflows/DroopExamples.yml'
      - 'src/**'
      - 'Project.toml'
  workflow_dispatch:
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        julia: ['1.10', '1.12']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - name: Instantiate isolated examples against this checkout
        shell: julia --project=examples/droop {0}
        run: |
          using Pkg
          Pkg.develop(path=pwd())
          Pkg.instantiate()
      - name: Check models, derivatives and saved points (no solves)
        run: julia --project=examples/droop examples/droop/test.jl
